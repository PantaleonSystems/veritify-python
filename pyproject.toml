[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veritify"
version = "0.1.0"
description = "Official Python SDK for the Veritify API — verifiable signal integrity and novelty detection for data streams."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Pantaleon Systems" },
]
keywords = [
    "veritify",
    "api",
    "sdk",
    "data-integrity",
    "anomaly-detection",
    "novelty-detection",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "responses>=0.24",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/PantaleonSystems/veritify-python"
Documentation = "https://github.com/PantaleonSystems/veritify-python/blob/main/docs/getting-started.md"
Changelog = "https://github.com/PantaleonSystems/veritify-python/blob/main/CHANGELOG.md"
Issues = "https://github.com/PantaleonSystems/veritify-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/veritify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
